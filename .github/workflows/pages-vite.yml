name: Deploy Vite museum to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: immersive-pages-deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test project data
        run: npm test
      - name: Compile public site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Enforce bundle budgets
        run: npm run budget
      - name: Verify HTML and legacy redirects
        run: test -f dist/index.html && test -f dist/museum-2026.html && test -f dist/cabinet.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Install Chromium for public-site verification
        run: npx playwright install --with-deps chromium
      - name: Verify real GitHub Pages site and take screenshots
        run: node scripts/verify-live.mjs
      - name: Keep live-site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-portfolio-screenshots
          path: live-proof/
          retention-days: 7
