name: Verify published portfolio in browser
on:
  push:
    branches: [ops/live-pages-diagnostics]
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Visit public Pages URL and capture actual screenshots
        run: node scripts/verify-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-live-portfolio
          path: live-proof/
          retention-days: 7
