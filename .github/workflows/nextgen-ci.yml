name: Immersive museum validation
on:
  push:
    branches:
      - feat/immersive-r3f-museum
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'vite.config.js'
      - 'index.html'
jobs:
  unit-build-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: GITHUB_PAGES=true npm run build
      - run: test -f dist/index.html && test -d dist/assets
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and responsive screenshots
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: museum-browser-evidence
          path: test-results/
          retention-days: 7
